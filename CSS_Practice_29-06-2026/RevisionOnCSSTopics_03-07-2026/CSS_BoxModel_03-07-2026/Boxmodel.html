<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        /*content area*/
        .box{
    width:200px;
    height:100px;
    border:2px solid black;
}
/*padding area*/
.box1{
    width:200px;
    border:2px solid black;
    padding:30px;
}
/*border*/
.box2{
    width:200px;
    padding:20px;
    border:5px solid blue;
}
/*margin*/
.box3{
    width:200px;
    padding:20px;
    border:2px solid black;
    margin:50px;
}
/*complete example*/
.box4{
    width:250px;
    height:120px;

    padding:20px;

    border:5px solid red;

    margin:40px;

    background-color:lightblue;
}


    </style>
</head>
<body>
    content area
    <div class="box">hello</div>
    <br>
    <br>
    padding area
    <div class="box1">hello world</div>
    <br>
    <br>
    border
    <div class="box2">hello universe</div>
    <br><br>
    margin
    <div class="box3">hello universe</div>
    <br>
    <br>
    <div class="box4">hello universe complete</div>
    





    
</body>
</html>
