<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Libraries</title>
</head>
<body>
    import { BrowserRouter, Routes, Route } from "react-router-dom";

function App() {
  return (
    <BrowserRouter>
      <Routes>
        <Route path="/" element={<h1>Home</h1>} />
        <Route path="/about" element={<h1>About</h1>} />
      </Routes>
    </BrowserRouter>
  );
}

<button className="bg-blue-500 text-white p-2">
  Submit
</button>
    
</body>
</html>

<!--
Understand the purpose of:
React DOM:
React DOM

React DOM connects React with the browser DOM.

It is responsible for:

Rendering React components
Updating the UI
Connecting React to HTML elements

React Router: React Router is used for navigation between pages in React applications.

Axios : 
Axios is used to communicate with APIs and servers.

It sends:

GET requests
POST requests
PUT requests
DELETE requests

Redux (Introduction) : Redux is used to manage global application state

Advantages of Redux
Centralized data management
Predictable state updates
Easier debugging
Better scalability

React Hooks (Introduction) : 
Hooks are special React functions that allow functional components to use React features.

Hooks were introduced to simplify React development.

React Developer Tools: 
React Developer Tools is a browser extension used to inspect and debug React applications.

Why React Developer Tools is Used

It helps developers:

Inspect components
View props and state
Debug React applications
Analyze component hierarchy

*/ Features
Component inspection
State debugging
Props viewing
Performance analysis

-->

<!--
| Tool/Concept          | Purpose                                          |
| --------------------- | ------------------------------------------------ |
| React DOM             | Render React UI in browser                       |
| React Router          | Navigation between pages                         |
| Axios                 | API communication                                |
| Redux                 | Global state management                          |
| React Hooks           | Use state and lifecycle in functional components |
| React Developer Tools | Debug React applications                         |
-->
