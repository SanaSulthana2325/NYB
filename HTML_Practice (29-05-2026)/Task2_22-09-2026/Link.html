Anchor Tag

Basic syntax:

<a href="https://www.google.com">Google</a>

Output:
Google

<a> → Anchor tag
href → Specifies where the link should go
Google → Text displayed to the user-->

Internal Link

An internal link connects one page of your website to another page of the same website. -->

<!-- 
target="_blank":  Normally, when you click a link, the new page opens in the same tab.

To open it in a new tab, use: -->



<!-- | Type      | Code                 | Purpose               |
| --------- | -------------------- | --------------------- |
| Anchor    | `<a href="...">`     | Creates a link        |
| Internal  | `href="about.html"`  | Opens your own page   |
| External  | `href="https://..."` | Opens another website |
| Email     | `href="mailto:..."`  | Sends email           |
| Telephone | `href="tel:..."`     | Makes a phone call    |
| New Tab   | `target="_blank"`    | Opens link in new tab | -->
