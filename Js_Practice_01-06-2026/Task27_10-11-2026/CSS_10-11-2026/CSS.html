<!-- What is CSS?
CSS stands for Cascading Style Sheets.

CSS is used to style and design HTML elements on a webpage.

HTML creates the structure of a webpage, whereas CSS makes the webpage attractive. -->


<!-- Types of CSS
Inline CSS
Definition: Inline CSS means writing CSS directly inside an HTML element using the style attribute. -->


<!-- Internal CSS
Definition: Internal CSS means writing CSS inside the HTML document using the <style> tag, generally inside the <head> section. -->


<!-- External CSS
Most commonly preferred for larger projects
Definition: External CSS means writing CSS in a separate file with the .css extension and connecting it to the HTML file using the <link> tag.

This is very important in real-time frontend development. -->



<!-- Feature	             Inline	           Internal	      External
Location	       HTML element	      HTML file	   Separate CSS file
Attribute/tag	      style	          <style>	   <link>
Reusability	          Low	          Limited	    High
Maintenance  	  Difficult	          Moderate	    Easy
Best use	     Quick styling	    Single page	   Multiple pages
Real-timeusage	Occasional	        Small pages	   Large projects -->


<!-- CSS Syntax
First, let's understand what CSS syntax means.

CSS syntax is the way we write CSS rules to apply styles to HTML elements. -->
