body{
    font-family:Arial;
}

.container{

    display:flex;

    justify-content:center;

    gap:20px;

    flex-wrap:wrap;

    padding:20px;
}

.card{

    width:250px;

    border:1px solid gray;

    border-radius:10px;

    padding:15px;

    text-align:center;

    box-shadow:0 0 10px lightgray;
}

img{
    width:100%;

    border-radius:10px;
}

button{

    background-color:orange;

    color:white;

    border:none;

    padding:10px 20px;

    border-radius:5px;

    cursor:pointer;
}
