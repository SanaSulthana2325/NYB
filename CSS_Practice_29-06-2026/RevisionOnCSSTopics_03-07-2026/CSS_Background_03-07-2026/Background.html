<!--
CSS Backgrounds

Background properties are used to add colors or images behind elements.
1. background-color: vhange page background color
2. backgroung-image: adds an image as background
3. background-repeat: controls image repetition
4. background-position: 
5. background-size: makes image cover the entire page
6. background-attachment: background stay fixed during scrolling
-->

<!--
| Value       | Meaning                             |
| ----------- | ----------------------------------- |
| `repeat`    | Repeats horizontally and vertically |
| `repeat-x`  | Repeats only horizontally           |
| `repeat-y`  | Repeats only vertically             |
| `no-repeat` | Shows image only once               |
-->

<!--
| Property  | Used For                 | Space Location  |
| --------- | ------------------------ | --------------- |
| `margin`  | Space outside the border | Outside element |
| `padding` | Space inside the border  | Inside element  |
-->
