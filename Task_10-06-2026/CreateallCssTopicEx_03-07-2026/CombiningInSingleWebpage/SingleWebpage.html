<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice combining multiple CSS concepts within a single webpage.</title>
    <style>

        /* =====================
           GLOBAL STYLES
        ===================== */

        *{
            margin:0;
            padding:0;

            box-sizing:border-box;
        }

        body{

            font-family:Arial;

            background:#f4f4f4;
        }

        /* =====================
           NAVBAR
        ===================== */

        nav{

            background:black;

            color:white;

            padding:20px;

            display:flex;

            justify-content:space-between;

            align-items:center;

            position:sticky;

            top:0;

            z-index:1000;
        }

        ul{

            display:flex;

            gap:20px;

            list-style:none;
        }

        /* =====================
           HERO SECTION
        ===================== */

        .hero{

            height:500px;

            background-image:url(
            "https://via.placeholder.com/1200x500");

            background-size:cover;

            background-position:center;

            position:relative;
        }

        /* Overlay */

        .overlay{

            position:absolute;

            width:100%;
            height:100%;

            background:black;

            opacity:0.5;
        }

        /* Hero Content */

        .hero-content{

            position:absolute;

            top:50%;
            left:50%;

            transform:
            translate(-50%,-50%);

            color:white;

            text-align:center;

            z-index:2;
        }

        .hero-content h1{

            font-size:50px;

            margin-bottom:20px;
        }

        .hero-content button{

            padding:15px 30px;

            border:none;

            background:orange;

            color:white;

            cursor:pointer;
        }

        /* =====================
           FOOD SECTION
        ===================== */

        .food-section{

            padding:50px;
        }

        .food-section h2{

            text-align:center;

            margin-bottom:40px;
        }

        /* Grid */

        .food-container{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(250px,1fr));

            gap:30px;
        }

        /* Food Card */

        .card{

            background:white;

            border-radius:10px;

            overflow:hidden;

            box-shadow:0px 0px 10px gray;

            transition:0.3s;
        }

        .card:hover{

            transform:scale(1.05);
        }

        .card img{

            width:100%;

            height:200px;

            object-fit:cover;
        }

        .card-content{

            padding:20px;
        }

        .card-content h3{

            margin-bottom:10px;
        }

        .card-content p{

            margin-bottom:15px;

            color:gray;
        }

        .card-content button{

            background:orange;

            color:white;

            border:none;

            padding:10px 20px;

            cursor:pointer;
        }

        /* =====================
           FOOTER
        ===================== */

        footer{

            background:black;

            color:white;

            text-align:center;

            padding:20px;

            margin-top:40px;
        }

        /* =====================
           RESPONSIVE DESIGN
        ===================== */

        @media (max-width:768px){

            nav{

                flex-direction:column;

                gap:20px;
            }

            ul{

                flex-direction:column;

                align-items:center;
            }

            .hero-content h1{

                font-size:35px;
            }
        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <h1>FoodHub</h1>

        <ul>

            <li>Home</li>
