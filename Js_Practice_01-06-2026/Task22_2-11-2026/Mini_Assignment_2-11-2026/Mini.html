
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter and User Session</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
        }

        h1, h2 {
            color: #243b53;
        }

        #count {
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            margin: 20px;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            padding: 10px 14px;
            margin: 5px 3px;
            border: none;
            border-radius: 5px;
            background: #1769aa;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #104d80;
        }

        #sessionMessage {
            margin-top: 15px;
            color: #1769aa;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>hello </h1>

        <div class="card">
            <h2>1. Counter Application</h2>

            <div id="count">0</div>

            <button id="increaseBtn">Increase +</button>
            <button id="decreaseBtn">Decrease -</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="card">
            <h2>2. User Session Management</h2>

            <label for="username">Enter username:</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your name"
            >

            <button id="loginBtn">Login</button>
            <button id="logoutBtn">Logout</button>

            <p id="sessionMessage">Please log in.</p>
        </div>
    </div>

    <script src="./Mini.js"></script>
</body>
</html>
