
<!DOCTYPE html>
<html>
<head>
    <title>Responsive HR Management Website</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        /* Common CSS */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
        }

        header {
            background-color: navy;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Navigation */
        nav {
            background-color: #333;
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        /* Main container */
        .container {
            width: 90%;
            margin: 30px auto;
        }

        /* Employee cards */
        .employee-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 10px gray;
        }

        .card h2 {
            color: navy;
        }

        .card p {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        /* TABLET SCREEN */
        @media screen and (max-width: 800px) {

            .employee-container {
                grid-template-columns: repeat(2, 1fr);
            }

            nav {
                gap: 15px;
            }

        }

        /* MOBILE SCREEN */
        @media screen and (max-width: 550px) {

            .employee-container {
                grid-template-columns: 1fr;
            }

            nav {
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }

            header {
                font-size: 14px;
            }

        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }

    </style>
</head>

<body>

    <header>
        <h1>HR Management System</h1>
        <p>Employee Dashboard</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Employees</a>
        <a href="#">Attendance</a>
        <a href="#">Recruitment</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <h2>Employee Information</h2>

        <div class="employee-container">

            <div class="card">
                <h2>Total Employees</h2>
                <p>125</p>
            </div>

            <div class="card">
                <h2>New Employees</h2>
                <p>15</p>
            </div>

            <div class="card">
                <h2>Open Positions</h2>
                <p>08</p>
            </div>

            <div class="card">
                <h2>Interviews</h2>
                <p>20</p>
            </div>

            <div class="card">
                <h2>Departments</h2>
                <p>06</p>
            </div>

            <div class="card">
                <h2>On Leave</h2>
                <p>10</p>
            </div>

        </div>

    </div>

    <footer>
        <p>HR Management System © 2026</p>
    </footer>

</body>
</html>
