
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task and Employee Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            margin: 0;
            padding: 20px;
        }

        h1, h2 {
            color: #26356b;
        }

        .container {
            max-width: 950px;
            margin: auto;
        }

        .box {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .task {
            background: #eef2ff;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
        }

        .completed {
            color: green;
            font-weight: bold;
        }

        .delete {
            background: red;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stats p {
            background: #e0e7ff;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Task and Employee Management System</h1>

    <!-- Dashboard -->
    <div class="box">
        <h2>Dashboard</h2>

        <div class="stats">
            <p>Total Employees: <span id="employeeCount">0</span></p>
            <p>Total Tasks: <span id="taskCount">0</span></p>
            <p>Completed: <span id="completedCount">0</span></p>
            <p>Pending: <span id="pendingCount">0</span></p>
        </div>
    </div>

    <!-- Add Employee -->
    <div class="box">
        <h2>Add Employee</h2>

        <input type="text"
               id="employeeName"
               placeholder="Enter employee name">

        <input type="text"
               id="employeeRole"
               placeholder="Enter employee role">

        <button id="addEmployeeBtn">Add Employee</button>

        <div id="employeeList"></div>
    </div>

    <!-- Add Task -->
    <div class="box">
        <h2>Create Task</h2>

        <input type="text"
               id="taskTitle"
               placeholder="Enter task title">

        <select id="taskEmployee">
            <option value="">Select Employee</option>
        </select>

        <select id="priority">
            <option value="High">High</option>
            <option value="Medium" selected>Medium</option>
            <option value="Low">Low</option>
        </select>

        <button id="addTaskBtn">Add Task</button>
    </div>

    <!-- Search and Filter -->
    <div class="box">
        <h2>Manage Tasks</h2>

        <input type="text"
               id="searchTask"
               placeholder="Search tasks...">

        <select id="filterStatus">
            <option value="All">All Tasks</option>
            <option value="Pending">Pending</option>
            <option value="Completed">Completed</option>
        </select>

        <select id="sortTasks">
            <option value="Newest">Newest First</option>
            <option value="Title">Title A-Z</option>
            <option value="Priority">Priority</option>
        </select>

        <div id="taskList"></div>
    </div>

</div>


<script src="./Mini.js"></script>

</body>
</html>
