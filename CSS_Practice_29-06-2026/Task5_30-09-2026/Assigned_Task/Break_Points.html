<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* change background-color at different breakpoint */

        .box{
            background-color: aquamarine;
            padding: 20px;
            text-align: center;
        }
        /* mobile */
        @media(max-width:480px){
            .box{
                background-color: blueviolet;
            }
        }

        /* Tablet */
        @media(min-width:481px) and (max-width: 768px){
            .box{
                background-color: greenyellow;
            }
        }

        /* laptop */
        @media(min-width:769px) and (max-width: 1200px){
            .box{
                background-color: palevioletred;
            }
        }

        /* desktop */
        @media(min-width:1201px){
            .box{
                background-color: cyan;
            }
        }

        /* Change Font Size Using Breakpoints */

        h1{
            font-size: 40px;
            text-align: center;
        }

        /* mobile */
        @media (max-width:480px){
            h1{
                font-size:20px;
            }
        }

        /* Tablet */
        @media(min-width:481px) and (max-width: 768px){
            h1{
                font-size:40px;
            }
        }

        /* laptop */
        @media(min-width:769px) and (max-width:1200px){
            h1{
                font-size:60px ;
            }
        }

        /* desktop */
        @media(min-width:1201px){
            h1{
               font-size: 90px; 
            }
        }

/* Change Card Layout Using Breakpoints */
        .container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    padding: 20px;
}

.card {
    background-color: rgb(6, 183, 241);
    padding: 40px;
    text-align: center;
}

/* Mobile */
@media (max-width: 480px) {
    .container {
        grid-template-columns: 1fr;
    }
}

/* Tablet */
@media (min-width: 481px) and (max-width: 768px) {
    .container {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* Laptop */
@media (min-width: 769px) and (max-width: 1200px) {
    .container {
        grid-template-columns: repeat(3, 1fr);
    }
}

/* Desktop */
@media (min-width: 1201px) {
    .container {
        grid-template-columns: repeat(4, 1fr);
    }
}

/* Change Navigation Layout */

nav {
    display: flex;
    justify-content: center;
    gap: 30px;
    background-color: black;
    padding: 20px;
}

nav a {
    color: white;
    text-decoration: none;
}

/* Mobile */
@media (max-width: 480px) {
    nav {
        flex-direction: column;
        align-items: center;
    }
}












    </style>
</head>
<body>
    <h2> change background-color at different breakpoint</h2>

    <div class="box">
        <h3> tasan</h3>
        <p> this is my screen</p>
    </div>



    <hr>
    <h2>Change Font Size Using Breakpoints</h2>

    <h1> Welcome to wrold</h1>
    <hr>

    <h2>Change Card Layout Using Breakpoints</h2>
     <div class="container">

        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
        <div class="card">Card 4</div>

    </div>
    <hr>
    <h2>Change Navigation Layout</h2>

     <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
    
</body>
</html>

What are Media Query Breakpoints?

A breakpoint is a specific screen width where the website design changes. -->
