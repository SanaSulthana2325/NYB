<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CSS Project</title>
    <style>
        /* Body */
body{
    font-family: Arial;
    background-color: rgb(223, 236, 240);
    padding: 20px;
}

/* Heading */
h1{
    color: darkblue;
    text-align: center;
}

/* Paragraph */
p{
    color: green;
    font-size: 18px;
}

/* Box */
.box{
    width: 300px;
    height: 100px;

    background-color: white;

    border: 3px solid blue;

    padding: 20px;

    margin: 20px 0;
}

/* Button */
button{
    background-color: blue;
    color: white;

    border: none;

    padding: 10px 20px;

    border-radius: 5px;
}

/* Form Inputs */
input{
    width: 250px;

    padding: 10px;

    border: 1px solid gray;

    border-radius: 5px;
}

/* Table */
table{
    width: 300px;

    border-collapse: collapse;

    margin-top: 20px;
}

th{
    background-color: blue;
    color: white;
}

th, td{
    border: 1px solid black;
    padding: 10px;
}
    </style>
</head>
<body>

    <h1>Welcome to My Website</h1>

    <p>This is a simple project using External CSS.</p>

    <!-- Box -->
    <div class="box">
        This is a styled box.
    </div>

    <!-- Button -->
    <button>Click Me</button>

    <!-- Form -->
    <h2>Registration Form</h2>

    <form>
        <input type="text" placeholder="Enter Name">
        <br><br>

        <input type="email" placeholder="Enter Email">
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <!-- Table -->
    <h2>Student Details</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>Sana</td>
            <td>HTML</td>
        </tr>

        <tr>
            <td>Aisha</td>
            <td>CSS</td>
        </tr>
    </table>

</body>
</html>
