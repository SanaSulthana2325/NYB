
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Management Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .task-form {
            display: flex;
            gap: 10px;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #taskInput {
            flex: 1;
            min-width: 0;
        }

        #searchInput, #filter {
            width: 100%;
            margin-top: 15px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            background-color: #2563eb;
            cursor: pointer;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 10px;
            padding: 12px;
            background-color: #f1f5f9;
            border-radius: 5px;
        }

        .task-name {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .edit {
            background-color: orange;
        }

        .delete {
            background-color: red;
        }

        .complete {
            background-color: green;
        }

        #taskCount {
            text-align: center;
            color: #2563eb;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .task-form {
                flex-direction: column;
            }

            li {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Task Management Application</h1>

        <!-- Add Task -->
        <div class="task-form">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task"
            >

            <button onclick="addTask()">Add Task</button>

        </div>

        <!-- Search Task -->
        <input
            type="text"
            id="searchInput"
            placeholder="Search tasks..."
            oninput="displayTasks()"
        >

        <!-- Filter Task -->
        <select id="filter" onchange="displayTasks()">

            <option value="all">All Tasks</option>
            <option value="pending">Pending Tasks</option>
            <option value="completed">Completed Tasks</option>

        </select>

        <h2>My Tasks</h2>

        <!-- Display Tasks -->
        <ul id="taskList"></ul>

        <h3 id="taskCount">Total Tasks: 0</h3>

    </div>

    <script src="./Mini.js"></script>

</body>
</html>
