<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width:100px;
            height:100px;
            background-color: blue;
            animation:moveBox 3s infinite;
        }

        @keyframes moveBox{
            0%{
                transform:translateX(0);
                background-color: blue;
            }
            50%{
                transform:translatex(200px);
                background-color: red;
            }
            100%{
                transform:translateX(0);
                background-color: green;;
            }
        }
        /* loading */
        .spinner{
            width:60px;
            height:60px;
            border:6px solid lightgray;
            border-top:6px solid blue;
            border-radius: 50%;

            animation:rotate is linear infinite;
        }

        @keyframes rotate{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(260deg);
            }
        }

        /* timing function */
        .box1 {
    width: 80px;
    height: 40px;
    background: blue;
    margin: 15px;

    animation: move 3s infinite alternate;
}

.linear {
    animation-timing-function: linear;
}

.ease {
    animation-timing-function: ease;
}

.ease-in {
    animation-timing-function: ease-in;
}

.ease-out {
    animation-timing-function: ease-out;
}

.ease-in-out {
    animation-timing-function: ease-in-out;
}

@keyframes move {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(200px);
    }
}
.box2{
    width:100px;
    height:100px;
    background: rgb(16, 176, 224);

    transform:translate(100px,50px);
    transform:rotate(45deg);
    transform:scale(1.5);
    transform: skew(20deg);
    transform-origin: top-left;
}
/* hover button */
button{
    background-color: blue;
    color:white;
    padding:15px 30px;
    border:none;

    transition:background-color 0.5s;
}

button:hover{
    background-color: red;
}

/* transition */
.box3 {
    width: 100px;
    height: 100px;
    background: blue;

    transition-property: width, background-color;
    transition-duration: 2s;
    transition-delay: 0.5s;
    transition-timing-function: ease-in-out;
}

.box3:hover {
    width: 250px;
    background-color: orange;
}

/* tooltip */
.tooltip{
    position:relative;
    display:inline-block;
    margin:50px;
    background:blue;
    color:white;
    padding:12px 20px;
    border-radius:5px;
}

.tooltip.message{
    visibility: hidden;
    width:150px;
    background: black;
    color: white;
    text-align:center;
    padding:8px;
    border-radius: 5px;

    position:absolute;
    bottom:130%;
    left:50%;
    transform:translatex(-50%);
}

.tooltip:hover .message{
    visibility:visible;
}

/* dropdown */

dropdown {
    position: relative;
    display: inline-block;
}

.dropbtn {
    background: blue;
    color: white;
    padding: 15px 25px;
    border: none;
    cursor: pointer;
}

.dropdown-content {
    display: none;
    position: absolute;
    background: white;
    min-width: 160px;
    box-shadow: 0 4px 8px gray;
}

.dropdown-content a {
    display: block;
    color: black;
    padding: 12px;
    text-decoration: none;
}

.dropdown-content a:hover {
    background: lightgray;
}

.dropdown:hover .dropdown-content {
    display: block;
}



        
    </style>
</head>
<body>
    <h2> Css Animations </h2>
    <div class="box"></div>
    <hr/>
    <br/>

<p>Linear</p>

<div class="box ease-out"></div>

<p>Ease-in-out</p>
<div class="box ease-in-out"></div>

<!-- What is CSS Animation?
CSS Animation allows us to move or change an element automatically without clicking or hovering on it. -->


<!-- What are Keyframes?
@keyframes defines how an animation should look at different stages.

For example:
- 0% – Starting position.
- 50% – Middle position.
- 100% – Ending position. -->


<!-- What are Animation Properties?
Animation properties control how an animation works, including its speed, duration, repetition and direction.

Important animation properties:
Property	Meaning
animation-name	Name of the animation
animation-duration	How long animation takes
animation-delay	Waiting time before animation starts
animation-iteration-count	Number of repetitions
animation-direction	Direction of animation
animation-timing-function	Controls animation speed
animation-fill-mode	Controls styles before/after animation -->
