<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:flex;
            flex-direction: column;

            gap:15px;
        }
        .card{
            width:120px;
            padding:20px;
            background-color: lightblue;
        }
        .box{
            display:flex;

            justify-content: flex-start;
            justify-content:center;
            justify-content:space-between;
            justify-content:flex-end;
            justify-content:space-around;
            justify-content:space-evenly;
            gap:15px;
        }
        .box1{
            width:120px;
            padding:20px;
            background-color: lightblue;
        }
        /* align-item */

        .box2{
            display:flex;
            flex-direction: column;
            align-items: flex-start;
            align-items: flex-end;
            align-items: baseline;
            align-items: center;
            align-items: self-start;
            gap:15px;
        }
        .box3{
            width:120px;
            padding:20px;
            background-color: rgb(230, 11, 219);
        }
        .box4{
            display:flex;
            flex-direction: column;
            flex-wrap: wrap;
            flex-wrap: nowrap;
            flex-wrap: wrap-reverse;
            flex-grow: 1;
            gap:15px;
        }
        .box5{
            width:120px;
            padding:20px;
            background-color: rgb(13, 209, 88);
            flex-grow: 2;
            flex-shrink: 1;

        }

        /* grid */
        .website {
    display: grid;

    grid-template-columns: 200px 1fr;

    grid-template-rows: 80px 300px 60px;

    gap: 10px;
}

header {
    grid-column: 1 / 3;
    background-color: cadetblue;
}

aside {
    background: lightgreen;
}

main {
    background: lightblue;
}

footer {
    grid-column: 1 / 3;
    background-color: chocolate;
}

    </style>
</head>
<body>
    <!--flex box-->
    <div class="container">
        <div class="card">Product 1</div>
        <div class="card">Product 2</div>
        <div class="card">Product 3</div>


    </div>
    <hr/>
    <br/>
    <!--justify content-->

    <div class="box">
        <div class="box1">AAA</div>
        <div class="box1">BBB</div>
        <div class="box1">CCC</div>

    </div>
    
    <hr/>
    <br/>
    <!--align-items-->

    <div class="box2">
        <div class="box3">AbA</div>
        <div class="box3">BcB</div>
        <div class="box3">CdC</div>

    </div>
    <hr/>
    <br/>
    <!--flex-wrap

Controls whether items move to the next line when there is not enough space.

Values:
- nowrap – Default, items stay on one line.
- wrap – Items move to the next line.
- wrap-reverse – New lines appear in reverse cross-axis order.-->

<div class="box4">
        <div class="box5">AbA</div>
        <div class="box5">BcB</div>
        <div class="box5">CdC</div>

    </div>

    <hr/>
    <br/>
    <!--grid-->

    <div class="website">
    <header>Header</header>
    <aside>Sidebar</aside>
    <main>Main Content</main>
    <footer>Footer</footer>
</div>

    
</body>
</html>



<!-- What is Flexbox?
Flexbox (Flexible Box Layout) is a CSS layout system used to arrange elements in a single direction — either horizontally (row) or vertically (column).

It helps us align, distribute, and manage space between elements. -->


<!-- What is CSS Grid?
CSS Grid is a two-dimensional CSS layout system used to arrange elements in rows and columns.

Unlike Flexbox, which mainly works in one direction at a time, Grid helps us manage both rows and columns together. -->
