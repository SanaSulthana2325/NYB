    <!--Create forms using different input types.-->
    <fieldset>  
        <h2>FORM</h2>  
        <form>
        <lable>name:</lable>
        <input type="text" placeholder="enter name">
        <br/><br>
        <lable>Email</lable>
        <input type="email" placeholder=" enter email">
        <br><br>

        <lable>age</lable>
        <input type="number" placeholder="enter age">

        <br>
        <lable>Date</lable>
        <input type="date" placeholder="DD-MM-YYYY">
        <br><br>

        <!-- Radio -->
        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <br><br>

        <!-- Checkbox -->
        <label>Skills:</label>

        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="javascript" name="skills" value="javascript">
        <label for="javascript">JavaScript</label>

        <br><br>

        <!-- File -->
        <label></label>Upload Photo:</label>
        <input type="file" >
        <br><br>

        <!-- Select and Option -->
        <label for="course">Choose Course:</label>

        <select id="course" name="course">
            <option value="">--Select Course--</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
        </select>

        <br><br>

        <!-- Textarea -->
        <label for="message">Address:</label><br>
        <textarea id="message" name="message"
                  rows="4" cols="30"
                  placeholder="Enter your address"></textarea>

        <br><br>

        <!-- Submit -->
        <input type="submit" value="Submit">

        <!-- Reset -->
        <input type="reset" value="Reset">

        </fieldset>

<!-- 
        Implement HTML5 form validations.
        HTML5 provides built-in form validation, so we can validate user input without JavaScript.

We can use attributes such as:

required
type="email"
min
max
minlength
maxlength
pattern -->

<br/>
<hr/>
<br/>
<fieldset>
    <legend><b>Registration Form</b></legend>
<h2> form validations</h2>
 <form>

        <!--  Text -->
        <label for="name">Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
            minlength="3"
            maxlength="20">

        <br><br>


        <!-- Email Validation -->
        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>

        <br><br>


        <!-- Password Validation -->
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
            minlength="8"
            maxlength="20">

        <br><br>


        <!-- Number Validation -->
        <label for="age">Age:</label>
        <input
            type="number"
            id="age"
            name="age"
            min="18"
            max="60"
            required>

        <br><br>


        <!-- Date -->
        <label for="dob">Date of Birth:</label>
        <input
            type="date"
            id="dob"
            name="dob"
            required>

        <br><br>


        <!-- Phone Number using Pattern -->
        <label for="phone">Phone Number:</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="10 digit phone number"
            pattern="[0-9]{10}"
            required>

        <br><br>


        <!-- Radio -->
        <label>Gender:</label>

        <input
            type="radio"
            id="male1"
            name="gender1"
            value="male1"
            required>
        <label for="male1">Male</label>

        <input
            type="radio"
            id="female1"
            name="gender1"
            value="female1">
        <label for="female1">Female</label>

        <br><br>


        <!-- Checkbox -->
        <input
            type="checkbox"
            id="terms"
            name="terms"
            required>

        <label for="terms">
            I agree to the terms and conditions
        </label>

        <br><br>


        <!-- Submit -->
        <input type="submit" value="Register">

        <!-- Reset -->
        <input type="reset" value="Reset">

        </fieldset>
</form>
