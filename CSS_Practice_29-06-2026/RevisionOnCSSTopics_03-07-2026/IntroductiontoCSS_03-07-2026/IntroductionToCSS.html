<!--
Introduction to CSS

CSS (Cascading Style Sheets) is a style sheet language used to control the appearance and layout of web pages. It works together with HTML.

HTML defines the structure of a webpage.
CSS defines how the webpage looks (colors, fonts, spacing, layout, etc.).
*Why Use CSS?
Makes web pages attractive.
Separates content from design.
Saves time by styling multiple pages with one stylesheet.
Improves user experience and responsiveness.-->

<!--
| Property           | Purpose                 |
| ------------------ | ------------------------|
| `color`            |Changes text color       |
| `background-color` |Changes background color |
| `font-size`        |Sets text size           |
| `font-family`      |Changes font             |
| `margin`           |Adds outside spacing     |
| `padding`          |Adds inside spacing      |
| `border`           |Adds a border            |
-->

<!--
TYPES OF CSS:
 ways to Apply Styles to an Element:
 There are 3 main ways to apply CSS styles to HTML elements:

Inline CSS
Internal CSS
External CSS

//*Inline CSS:

Inline CSS is written directly inside the HTML element using the style attribute.

//*Advantages
Easy for quick styling.
Useful for testing small changes.

//Disadvantages
Not reusable.
Makes HTML messy.
Difficult to maintain.

//2. internal css
Internal CSS is written inside the <style> tag within the <head> section of the HTML file.

//*Advantages
Better organization than inline CSS.
Good for single-page websites.

//*Disadvantages
Cannot reuse styles across multiple pages.

//external css
External CSS is written in a separate .css file and linked to the HTML file.

//*Advantages
Reusable across many pages.
Clean and maintainable.
Best method for large projects.

//*Disadvantages
Requires separate CSS file.
-->
<!--
| Feature     | Inline CSS     | Internal CSS         | External CSS         |
| ----------- | -------------- | -------------------- | -------------------- |
| Location    | Inside element | Inside `<style>` tag | Separate `.css` file |
| Reusability | No             | Limited              | Yes                  |
| Maintenance | Difficult      | Moderate             | Easy                 |
| Best For    | Small changes  | Single page          | Large websites       |
| Priority    | Highest        | Medium               | Lowest               |
-->
