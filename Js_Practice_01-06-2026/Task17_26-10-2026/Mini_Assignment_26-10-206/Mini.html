
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Student Result Management</h1>

    <form id="studentForm">
      <label>Student Name</label>
      <input type="text" id="name" placeholder="Enter student name" required>

      <label>Roll Number</label>
      <input type="text" id="roll" placeholder="Enter roll number" required>

      <h3>Enter Marks (0–100)</h3>

      <label>English</label>
      <input type="number" id="english" min="0" max="100" required>

      <label>Maths</label>
      <input type="number" id="maths" min="0" max="100" required>

      <label>Science</label>
      <input type="number" id="science" min="0" max="100" required>

      <label>Social Studies</label>
      <input type="number" id="social" min="0" max="100" required>

      <label>Computer</label>
      <input type="number" id="computer" min="0" max="100" required>

      <button type="submit">Calculate Result</button>
    </form>

    <h2>Student Results</h2>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Roll No.</th>
            <th>Total</th>
            <th>Percentage</th>
            <th>Grade</th>
            <th>Result</th>
          </tr>
        </thead>
        <tbody id="resultTable"></tbody>
      </table>
    </div>
  </div>

  <script src="./Mini.js"></script>
</body>
</html>
