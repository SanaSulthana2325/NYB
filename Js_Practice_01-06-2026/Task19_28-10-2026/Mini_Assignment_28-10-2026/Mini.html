
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Task Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 30px 15px;
      color: #1e293b;
    }

    .container {
      max-width: 750px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #00000012;
    }

    h1 {
      text-align: center;
      color: #2563eb;
    }

    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .stat {
      flex: 1;
      background: #eff6ff;
      padding: 15px;
      text-align: center;
      border-radius: 8px;
    }

    .stat h2 {
      margin: 5px 0;
      color: #2563eb;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 6px 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 5px;
      padding: 9px 12px;
      cursor: pointer;
      margin: 3px;
      font-size: 14px;
    }

    .primary {
      background: #2563eb;
      color: white;
      width: 100%;
      padding: 12px;
    }

    .edit {
      background: #f59e0b;
      color: white;
    }

    .delete {
      background: #dc2626;
      color: white;
    }

    .complete {
      background: #16a34a;
      color: white;
    }

    .cancel {
      background: #64748b;
      color: white;
    }

    .error {
      color: #dc2626;
      font-size: 14px;
      margin: 0 0 12px;
    }

    .task {
      border: 1px solid #e2e8f0;
      padding: 15px;
      margin-top: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    .task h3 {
      margin: 0 0 8px;
    }

    .task p {
      color: #64748b;
      white-space: pre-wrap;
    }

    .completed {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .completed h3 {
      text-decoration: line-through;
      color: #64748b;
    }

    .status {
      font-size: 13px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #64748b;
      padding: 20px;
    }

    @media (max-width: 500px) {
      .stats {
        flex-direction: column;
      }

      .container {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>My Task Manager</h1>
    <p>Organize your daily tasks easily.</p>

    <!-- Task statistics -->
    <div class="stats">
      <div class="stat">
        <p>Total Tasks</p>
        <h2 id="totalTasks">0</h2>
      </div>

      <div class="stat">
        <p>Completed</p>
        <h2 id="completedTasks">0</h2>
      </div>

      <div class="stat">
        <p>Pending</p>
        <h2 id="pendingTasks">0</h2>
      </div>
    </div>

    <!-- Task form -->
    <h2 id="formHeading">Add a New Task</h2>

    <form id="taskForm">
      <label for="taskTitle">Task Title *</label>
      <input
        type="text"
        id="taskTitle"
        placeholder="Example: Learn JavaScript"
      >

      <label for="taskDescription">Task Description</label>
      <textarea
        id="taskDescription"
        rows="3"
        placeholder="Enter task details (optional)"
      ></textarea>

      <p id="errorMessage" class="error" role="alert"></p>

      <button type="submit" class="primary" id="submitButton">
        Add Task
      </button>

      <button
        type="button"
        class="cancel"
        id="cancelButton"
        hidden
      >
        Cancel Edit
      </button>
    </form>

    <hr>

    <!-- Search and filter -->
    <h2>Your Tasks</h2>

    <input
      type="search"
      id="searchInput"
      placeholder="Search tasks..."
    >

    <select id="filterSelect">
      <option value="all">All Tasks</option>
      <option value="pending">Pending Tasks</option>
      <option value="completed">Completed Tasks</option>
    </select>

    <!-- JavaScript renders tasks here -->
    <div id="taskList"></div>
  </div>

  <script>
    // 1. Get HTML elements
    const taskForm = document.getElementById("taskForm");
    const taskTitle = document.getElementById("taskTitle");
    const taskDescription =
      document.getElementById("taskDescription");
    const errorMessage = document.getElementById("errorMessage");
    const taskList = document.getElementById("taskList");
    const searchInput = document.getElementById("searchInput");
    const filterSelect = document.getElementById("filterSelect");
    const submitButton = document.getElementById("submitButton");
    const formHeading = document.getElementById("formHeading");
    const cancelButton = document.getElementById("cancelButton");

    // 2. Load tasks from Local Storage
    let tasks = [];

    try {
      const savedTasks = localStorage.getItem("myTasks");
      const parsedTasks = savedTasks ? JSON.parse(savedTasks) : [];

      if (Array.isArray(parsedTasks)) {
        tasks = parsedTasks;
      }
    } catch (error) {
      console.error("Could not load saved tasks:", error);
    }

    // The ID of the task currently being edited
    let editingTaskId = null;

    // 3. Save tasks to Local Storage
    function saveTasks() {
      localStorage.setItem("myTasks", JSON.stringify(tasks));
    }

    // 4. Display tasks and statistics
    function renderTasks() {
      taskList.innerHTML = "";

      const searchText = searchInput.value.toLowerCase().trim();
      const filterValue = filterSelect.value;

      // Filter tasks using search text and status
      const filteredTasks = tasks.filter(function(task) {
        const matchesSearch =
          task.title.toLowerCase().includes(searchText) ||
          task.description.toLowerCase().includes(searchText);

        const matchesFilter =
          filterValue === "all" ||
          (filterValue === "completed" && task.completed) ||
          (filterValue === "pending" && !task.completed);

        return matchesSearch && matchesFilter;
      });

      // Update statistics
      const completedCount =
        tasks.filter(task => task.completed).length;

      document.getElementById("totalTasks").textContent = tasks.length;
      document.getElementById("completedTasks").textContent =
        completedCount;
      document.getElementById("pendingTasks").textContent =
        tasks.length - completedCount;

      // Display an empty message when there are no matching tasks
      if (filteredTasks.length === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "empty";
        emptyMessage.textContent =
          tasks.length === 0
            ? "No tasks yet. Add your first task!"
            : "No tasks match your search or filter.";

        taskList.appendChild(emptyMessage);
        return;
      }

      // Create task elements dynamically
      filteredTasks.forEach(function(task) {
        const taskCard = document.createElement("div");
        taskCard.className = task.completed
          ? "task completed"
          : "task";

        const title = document.createElement("h3");
        title.textContent = task.title;

        const description = document.createElement("p");
        description.textContent =
          task.description || "No description provided.";

        const status = document.createElement("span");
        status.className = "status";
        status.textContent =
          task.completed ? "Completed" : "Pending";

        const completeButton = document.createElement("button");
        completeButton.className = "complete";
        completeButton.dataset.action = "toggle";
        completeButton.dataset.id = task.id;
        completeButton.textContent =
          task.completed ? "Mark Pending" : "Complete";

        const editButton = document.createElement("button");
        editButton.className = "edit";
        editButton.dataset.action = "edit";
        editButton.dataset.id = task.id;
        editButton.textContent = "Edit";

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.dataset.action = "delete";
        deleteButton.dataset.id = task.id;
        deleteButton.textContent = "Delete";

        taskCard.append(
          title,
          description,
          status,
          document.createElement("br"),
          completeButton,
          editButton,
          deleteButton
        );

        taskList.appendChild(taskCard);
      });
    }

    // 5. Validate form and add or update a task
    taskForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const title = taskTitle.value.trim();
      const description = taskDescription.value.trim();

      if (title === "") {
        errorMessage.textContent = "Please enter a task title.";
        taskTitle.focus();
        return;
      }

      if (title.length > 100) {
        errorMessage.textContent =
          "Task title must be 100 characters or fewer.";
        taskTitle.focus();
        return;
      }

      errorMessage.textContent = "";

      if (editingTaskId !== null) {
        // Update the existing task
        const task = tasks.find(
          task => task.id === editingTaskId
        );

        if (task) {
          task.title = title;
          task.description = description;
        }
      } else {
        // Add a new task
        const newTask = {
          id: Date.now(),
          title: title,
          description: description,
          completed: false
        };

        tasks.push(newTask);
      }

      saveTasks();
      resetForm();
      renderTasks();
    });

    // 6. Reset the form after adding or updating
    function resetForm() {
      taskForm.reset();
      editingTaskId = null;
      formHeading.textContent = "Add a New Task";
      submitButton.textContent = "Add Task";
      cancelButton.hidden = true;
      errorMessage.textContent = "";
    }

    cancelButton.addEventListener("click", resetForm);

    // 7. Event delegation: handle all task buttons in one listener
    taskList.addEventListener("click", function(event) {
      const button = event.target.closest("button[data-action]");

      if (!button || !taskList.contains(button)) {
        return;
      }

      const taskId = Number(button.dataset.id);
      const action = button.dataset.action;

      if (action === "edit") {
        const task = tasks.find(task => task.id === taskId);

        if (!task) return;

        editingTaskId = task.id;
        taskTitle.value = task.title;
        taskDescription.value = task.description;
        formHeading.textContent = "Edit Task";
        submitButton.textContent = "Update Task";
        cancelButton.hidden = false;
        errorMessage.textContent = "";

        taskTitle.focus();
      }

      if (action === "delete") {
        const confirmed = confirm("Do you want to delete this task?");

        if (!confirmed) return;

        tasks = tasks.filter(task => task.id !== taskId);

        if (editingTaskId === taskId) {
          resetForm();
        }

        saveTasks();
        renderTasks();
      }

      if (action === "toggle") {
        const task = tasks.find(task => task.id === taskId);

        if (!task) return;

        task.completed = !task.completed;
        saveTasks();
        renderTasks();
      }
    });

    // 8. Search tasks while typing
    searchInput.addEventListener("input", renderTasks);

    // 9. Filter tasks by status
    filterSelect.addEventListener("change", renderTasks);

    // 10. Display saved tasks when the page opens
    renderTasks();
  </script>

</body>
</html>
