<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Layout Practice</title>

    <style>

        /* ---------- BASIC ---------- */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background: lightblue;
            padding: 20px;
            text-align: center;
        }


        /* ---------- 1. FLEXBOX ---------- */

        .flex-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            background: lightgray;
        }

        .flex-box {
            background: orange;
            padding: 20px;
            border: 2px solid black;
        }


        /* ---------- 2. CSS GRID ---------- */

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 20px;
        }

        .grid-box {
            background: lightgreen;
            padding: 30px;
            text-align: center;
            border: 2px solid black;
        }


        /* ---------- 3. POSITIONING ---------- */

        .position-container {
            position: relative;
            height: 150px;
            margin: 20px;
            background: lightyellow;
            border: 2px solid black;
        }

        .relative-box {
            position: relative;
            left: 20px;
            top: 10px;
            background: pink;
            padding: 10px;
            width: 100px;
        }

        .absolute-box {
            position: absolute;
            right: 20px;
            top: 20px;
            background: lightblue;
            padding: 10px;
        }


        /* ---------- 4. Z-INDEX ---------- */

        .overlap {
            position: relative;
            height: 150px;
            margin: 20px;
        }

        .box1 {
            position: absolute;
            left: 50px;
            top: 20px;
            background: red;
            width: 100px;
            height: 100px;
            z-index: 1;
        }

        .box2 {
            position: absolute;
            left: 100px;
            top: 50px;
            background: blue;
            width: 100px;
            height: 100px;
            z-index: 2;
        }


        /* ---------- 5. RESPONSIVE LAYOUT ---------- */

        .responsive-container {
            display: flex;
            padding: 20px;
        }

        .sidebar {
            width: 30%;
            background: lightgray;
            padding: 20px;
        }

        .main {
            width: 70%;
            background: lightgreen;
            padding: 20px;
        }


        /* ---------- MOBILE ---------- */

        @media (max-width: 600px) {

            /* Flex becomes column */
            .flex-container {
                flex-direction: column;
                gap: 10px;
            }

            /* Grid becomes one column */
            .grid-container {
                grid-template-columns: 1fr;
            }

            /* Desktop layout becomes mobile layout */
            .responsive-container {
                flex-direction: column;
            }

            .sidebar,
            .main {
                width: auto;
            }
        }

    </style>
</head>

<body>

    <header>
        <h1>CSS Layout Practice</h1>
    </header>


    <!-- FLEXBOX -->

    <h2>1. Flexbox</h2>

    <div class="flex-container">

        <div class="flex-box">Box 1</div>
        <div class="flex-box">Box 2</div>
        <div class="flex-box">Box 3</div>

    </div>


    <!-- GRID -->

    <h2>2. CSS Grid</h2>

    <div class="grid-container">

        <div class="grid-box">Box 1</div>
        <div class="grid-box">Box 2</div>
        <div class="grid-box">Box 3</div>
        <div class="grid-box">Box 4</div>
        <div class="grid-box">Box 5</div>
        <div class="grid-box">Box 6</div>

    </div>


    <!-- POSITIONING -->

    <h2>3. CSS Positioning</h2>

    <div class="position-container">

        <div class="relative-box">
            Relative
        </div>

        <div class="absolute-box">
            Absolute
        </div>

    </div>


    <!-- Z-INDEX -->

    <h2>4. Z-Index Overlapping</h2>

    <div class="overlap">

        <div class="box1"></div>

        <div class="box2"></div>

    </div>


    <!-- RESPONSIVE -->

    <h2>5. Responsive Layout</h2>

    <div class="responsive-container">

        <div class="sidebar">
            <h3>Sidebar</h3>
            <p>Menu</p>
            <p>Links</p>
        </div>

        <div class="main">
            <h3>Main Content</h3>
            <p>This is the main content area.</p>
        </div>

    </div>

</body>
</html>
