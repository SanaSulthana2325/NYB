}

    border: 3px solid green;

}

<!-- CSS Specificity

Specificity decides which CSS rule wins when multiple rules target the same element. -->


<!-- Inline CSS

   ↓

<!--  CSS Box Model

Every HTML element is treated like a box.

The box model has four parts:

┌──────────────────────────────┐
│           MARGIN             │
│  ┌────────────────────────┐  │
│  │         BORDER         │  │
│  │  ┌──────────────────┐  │  │
│  │  │     PADDING      │  │  │
│  │  │  ┌────────────┐  │  │  │
│  │  │  │  CONTENT   │  │  │  │
│  │  │  └────────────┘  │  │  │
│  │  └──────────────────┘  │  │
│  └────────────────────────┘  │
└──────────────────────────────┘
1. Content

The actual text/image.

width: 200px;
height: 100px;
2. Padding

Space inside the border.

padding: 20px;
3. Border

The boundary.

border: 2px solid black;
4. Margin

Space outside the border.

margin: 20px; -->



<!-- | Topic              | Easy Meaning                        | Example                       |
| ------------------ | ----------------------------------- | ----------------------------- |
| Selector           | Selects HTML element                | `p {}`                        |

| `:hover`           | Mouse over                          | `button:hover`                |
