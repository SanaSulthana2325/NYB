<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>

    <h2>Table</h2>

    <table border="1">

        <tr>
            <td> Sana</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Tasleem</td>
            <td>87</td>
        </tr>
    </table>

    <!---->
    <br/>
    <hr/>

    <table border="1">
        <tr>
            <th colspan="2"> Student Details </th>
        </tr>

        <tr>
            <th>roll no</th>
            <th>name</th>
            <th>age</th>
            <th>place</th>
        </tr>
        <tr>
            <td>101</td>
            <td>AAA</td>
            <td>34</td>
            <td>warangal</td>
        </tr>

        <tr>
            <td>102</td>
            <td>BBB</td>
            <td>29</td>
            <td>hyd</td>
        </tr>

        <tr>
            <td>103</td>
            <td>CCC</td>
            <td>34</td>
            <td>khazipet</td>
        </tr>

        <tr>
            <td>104</td>
            <td>DDD</td>
            <td>27</td>
            <td colspan="2">AP</td>
        </tr>
    </table>
    

<br/>
<hr/>

    <!---->

    <table border="1">
        <caption> Department</caption>
    <tr>
        <th>Department</th>
        <th>Employee</th>
    </tr>

    <tr>
        <td rowspan="2">HR</td>
        <td>Priya</td>
    </tr>

    <tr>
        <td>Arun</td>
    </tr>

    <tr>
        <td>IT</td>
        <td>Rahul</td>
    </tr>
</table>

</body>
</html>


<!-- 
The main table concepts are:

Table → <table>
Table Row → <tr>
Table Header → <th>
Table Data → <td>
colspan → Combine columns
rowspan → Combine rows
Table Caption → <caption> -->

<!-- 
    Table Caption <caption>

<caption> provides a title or description for the table.

It is normally placed immediately after the opening <table> tag.

Example -->


<!-- | Concept          | Tag/Attribute | Purpose                    |
| ---------------- | ------------- | -------------------------- |
| **Table**        | `<table>`     | Creates the table          |
| **Table Row**    | `<tr>`        | Creates a row              |
| **Table Header** | `<th>`        | Creates a heading cell     |
| **Table Data**   | `<td>`        | Creates a data cell        |
| **Column Span**  | `colspan`     | Combines columns           |
| **Row Span**     | `rowspan`     | Combines rows              |
| **Caption**      | `<caption>`   | Gives a title to the table | -->
