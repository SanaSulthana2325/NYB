<!DOCTYPE html>
<html>
<head>
    <title>CSS Positioning and Z-Index</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
}

/* Sticky Position */
.sticky-header {
    background-color: navy;
    color: white;
    padding: 15px;
    text-align: center;

    position: sticky;
    top: 0;
}

/* Relative and Absolute */
.container {
    margin-top: 30px;
}

.parent {
    width: 300px;
    height: 180px;
    background-color: lightblue;
    padding: 10px;

    position: relative;
}

.child {
    width: 150px;
    height: 70px;
    background-color: orange;
    text-align: center;
    line-height: 70px;

    position: absolute;
    top: 50px;
    right: 10px;
}

/* Z-Index */
.box {
    width: 150px;
    height: 100px;
    position: relative;
    text-align: center;
    line-height: 100px;
    color: white;
}

.box1 {
    background-color: red;
    z-index: 1;
}

.box2 {
    background-color: green;
    margin-top: -60px;
    margin-left: 40px;
    z-index: 2;
}

.box3 {
    background-color: blue;
    margin-top: -60px;
    margin-left: 80px;
    z-index: 3;
}

/* Fixed Position */
.fixed-button {
    position: fixed;
    bottom: 20px;
    right: 20px;

    background-color: purple;
    color: white;
    padding: 15px;
    border-radius: 5px;
}

.extra-content {
    height: 500px;
}
    </style>
</head>
<body>

    <h1>CSS Positioning and Z-Index</h1>

    <!-- Sticky Header -->
    <header class="sticky-header">
        Sticky Header
    </header>
    <hr>

    <!-- Relative and Absolute -->
    <section class="container">
        <h2>Relative and Absolute</h2>

        <div class="parent">
            Parent Box (Relative)

            <div class="child">
                Child Box (Absolute)
            </div>
        </div>
    </section>
    <hr>


    <!-- Z-Index -->
    <section class="container">
        <h2>Z-Index Example</h2>

        <div class="box box1">Box 1 (z-index: 1)</div>
        <div class="box box2">Box 2 (z-index: 2)</div>
        <div class="box box3">Box 3 (z-index: 3)</div>
    </section>

    <!-- Fixed Position -->
    <div class="fixed-button">
        Fixed
    </div>

    

</body>
</html>
