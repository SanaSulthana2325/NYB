<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positions</title>
    <style>
    .box{
    width:200px;
    height:100px;
    background-color:skyblue;

    position:static;

    top:50px;
}
/*relative*/
.box1{
    width:200px;
    height:100px;
    background-color:orange;

    position:relative;

    left:50px;
    top:30px;
}
/*absolute*/
.parent{
    width:400px;
    height:250px;

    background-color:lightgray;

    position:relative;
}

.child{
    width:100px;
    height:100px;

    background-color:red;

    position:absolute;

    top:20px;
    right:20px;
}
/*fixed*/
.box2{
    width:200px;
    padding:20px;

    background-color:black;
    color:white;

    position:fixed;

    bottom:20px;
    right:20px;
}
.header{
    background-color:orange;

    padding:20px;

    position:sticky;

    top:0;
}

.content{
    height:1500px;
}
/*complete examle*/
.container{
    position:relative;
}

img{
    width:100%;
}

.text{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    color:white;

    font-size:40px;
}

</style>
</head>
<body>
    <div class="box">static</div>
    <br>
    <br>
    relative
    <div class="box1">relative</div>
    <br>
    <br>
    absolute
    <div class="parent">
        <div class="child"></div>
    </div> 
    <br>
    <br>
    fixed
    <div class="box2">fixed</div>
    <br>
    <br>
    sticky

CSS Position

The position property in CSS is used to control where an element appears on a webpage.

It helps you:

Move elements
Fix elements on screen
Create sticky navigation bars
Place buttons on images
Build professional layouts
-->
<!--
| Position   | Meaning                             |
| ---------- | ----------------------------------- |
| `static`   | Default position                    |
| `relative` | Moves relative to original position |
| `absolute` | Positions relative to parent        |
| `fixed`    | Fixed on screen                     |
| `sticky`   | Sticks while scrolling              |
-->
