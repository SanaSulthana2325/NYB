<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
    width: 200px;
    height: 100px;

    padding: 20px;

    border: 5px solid black;

    margin: 30px;

    background-color: lightblue;
}

/* display properties */
nav {
            display: block;
            display: inline;
            display: inline-block;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: black;
            padding: 20px;
        }

        a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- Understand and implement the CSS Box Model. -->
     <div class="box">
        <h2>Welcome</h2>
        <p>Learning CSS Box Model</p>
    </div>
    <br/>
    <hr/>
    <br/>
    <!--Work with different display properties.-->

     <nav>
        <a href="#">Home</a>
        <a href="#">About</a>

    </nav>
    <hr/>
    <br/>

</body>
</html>
