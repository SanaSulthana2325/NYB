
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Product Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        #searchInput {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        #status {
            text-align: center;
            font-weight: bold;
            margin: 15px 0;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
        }

        .product-card h3 {
            font-size: 16px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
        }

        .loading {
            color: blue;
        }

        .empty {
            color: #666;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>API-Based Product Search</h1>

        <input
            type="text"
            id="searchInput"
            placeholder="Search products... (e.g. phone, laptop)"
        >

        <p id="status"></p>

        <div id="productList" class="products"></div>

    </div>

    <script src="./Mini.js"></script>

</body>
</html>
