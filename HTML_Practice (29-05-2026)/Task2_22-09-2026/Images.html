<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image</title>

    <!-- Favicon -->
    <link rel="icon" href="./logo sam.jpg">
</head>

<body>

    <h2>Image Tag</h2>

    <!-- Local Image -->
    <img src="./bird logo 1.jpg" alt="Nature of bird">

    <br>
    <hr>

    <!-- Online Image -->
    <img 
        src="https://th.bing.com/th/id/OIP.VviB4M-AOvn5s5YGWnkNhAHaEO?r=0&o=7rm=3&rs=1&pid=ImgDetMain"
        alt="New world"
    >

    <br>
    <hr>

    <!-- Online Image with Width and Height -->
    <img 
        src="https://th.bing.com/th/id/OIP.CwQwzZUIKj5guldqvT3vuwHaEK?r=0&o=7rm=3&rs=1&pid=ImgDetMain"
        alt="Nature image"
        width="500"
        height="300"
    >

    <br>
    <hr>

    <h2>Click the logo to open Google</h2>

    <!-- Image as a Link -->
    <a href="https://www.google.com">
        <img src="./nyb photo.jpg" alt="Google">
    </a>

    <br>
    <hr>

    <h2>Click the image to open Amazon</h2>

    <!-- Amazon Image Link -->
    <a href="https://www.amazon.in/">
        <img 
            src="https://cdnb.artstation.com/p/marketplace/presentation_assets/003/430/263/large/file.jpg?1706950302"
            width="500"
            height="500"
            alt="Amazon"
        >
    </a>

    <br/>
    <hr/>
    <img src="https://images.pexels.com/photos/17461073/pexels-photo-17461073/free-photo-of-laptop-with-wallpaper.jpeg?auto=compress&cs=tinysrgb&w=1600" width="500" height="500" alt="Laptop">

</body>

</html>




<!-- 
src — Source of the Imag

src tells the browser where the image is located.

src means source. -->

<!-- 
alt — Alternative Text

alt means alternative text. -->

<!-- 
Why is alt important?

It is useful for:

When an image fails to load
Screen readers
Accessibility
Helping search engines understand the image -->


<!-- 
Favicon

A favicon is the small icon that appears in the browser tab. -->



<!-- | Topic      | Purpose                | Example                             |
| ---------- | ---------------------- | ----------------------------------- |
| `<img>`    | Displays an image      | `<img src="cat.jpg">`               |
| `src`      | Image location         | `src="cat.jpg"`                     |
| `alt`      | Image description      | `alt="A cat"`                       |
| `width`    | Controls width         | `width="300"`                       |
| `height`   | Controls height        | `height="200"`                      |
| Image Link | Makes image clickable  | `<a href="..."><img></a>`           |
| Favicon    | Small browser-tab icon | `<link rel="icon" href="logo.png">` | -->
