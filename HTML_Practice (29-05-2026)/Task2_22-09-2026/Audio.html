<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio</title>
</head>
<body>
    
    <h2> Audio </h2>

    <audio controls loop>
        <source src="./sample2.mp3" type="audio/mp3">
        </audio>

    <br/>
    <hr/>
    <audio controls autoplay muted>
        <source src="./sample20.mp3" type="audio/mp3">
    </audio>

    <br/>
    <hr>
    <audio controls muted>
        <source src="./sample1.mp3" type="audio/mp3"></sources>
    </audio>
<br/>
<hr/>
<h2>Video</h2>

<video width="300" height="300" controls>
    <source src="./video3.mp4" type="video/mp4">
</video>

<br/>
<hr/>

<video width="300" height="300" controls>
    <source src="./video.mp4" type="video/mp4">
</video>




    
</body>
</html>

<!-- 
<source>

The <source> element specifies the media file that should be played. -->

<!-- 
controls

The controls attribute displays the media controls. -->

<!-- 
autoplay

autoplay tells the browser to start playing the media automatically. -->
<!-- 
loop

loop makes the audio or video start again automatically after it finishes. -->
<!-- 
muted

muted makes the audio silent by default. -->
