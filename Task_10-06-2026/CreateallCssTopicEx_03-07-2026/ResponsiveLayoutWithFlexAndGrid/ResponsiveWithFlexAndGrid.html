<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build responsive layouts using both Flexbox and Grid.</title>
    <style>

        /* =========================
           GLOBAL STYLES
        ========================== */

        *{
            margin:0;
            padding:0;

            box-sizing:border-box;
        }

        body{

            font-family:Arial;

            background:#f4f4f4;
        }

        /* =========================
           NAVBAR USING FLEXBOX
        ========================== */

        nav{

            background:#222;

            color:white;

            padding:20px;

            display:flex;

            justify-content:space-between;

            align-items:center;

            flex-wrap:wrap;
        }

        .logo{

            font-size:28px;

            font-weight:bold;
        }

        ul{

            display:flex;

            gap:20px;

            list-style:none;
        }

        li{

            cursor:pointer;
        }

        /* =========================
           HERO SECTION
        ========================== */

        .hero{

            height:400px;

            background-image:url(
            "https://via.placeholder.com/1200x400");

            background-size:cover;

            background-position:center;

            display:flex;

            justify-content:center;

            align-items:center;

            color:white;

            text-align:center;
        }

        .hero h1{

            font-size:50px;

            background:rgba(0,0,0,0.5);

            padding:20px;
        }

        /* =========================
           DESTINATIONS SECTION
        ========================== */

        .section-title{

            text-align:center;

            margin:40px 0;
        }

        /* GRID LAYOUT */

        .places{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(250px,1fr));

            gap:20px;

            padding:20px;
        }

        /* CARD */

        .card{

            background:white;

            border-radius:10px;

            overflow:hidden;

            box-shadow:0px 0px 10px gray;

            transition:0.3s;
        }

        .card:hover{

            transform:translateY(-10px);
        }

        .card img{

            width:100%;

            height:200px;

            object-fit:cover;
        }

        .card-content{

            padding:20px;
        }

        .card-content h3{

            margin-bottom:10px;
        }

        .card-content p{

            margin-bottom:15px;

            color:gray;
        }

        .card-content button{

            background:orange;

            color:white;

            border:none;

            padding:10px 20px;

            cursor:pointer;
        }

        /* =========================
           FOOTER
        ========================== */

        footer{

            background:#222;

            color:white;

            text-align:center;

            padding:20px;

            margin-top:40px;
        }

        /* =========================
           RESPONSIVE DESIGN
        ========================== */

        @media (max-width:768px){

            nav{

                flex-direction:column;

                gap:20px;
            }

            ul{

                flex-direction:column;

                align-items:center;
            }

            .hero h1{

                font-size:35px;
            }

        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">

            TravelX

        </div>

        <ul>

            <li>Home</li>

            <li>Places</li>

            <li>Packages</li>

            <li>Contact</li>

        </ul>

    </nav>

    <!-- HERO SECTION -->

    <section class="hero">

        <h1>
            Explore Beautiful Places
        </h1>

    </section>

    <!-- DESTINATIONS -->

    <h2 class="section-title">

        Popular Destinations

    </h2>

    <section class="places">

        <!-- CARD 1 -->

        <div class="card">

            <img
            src="https://tse1.mm.bing.net/th/id/OIP.q1XXVBDajKaA4uu8DqMRnAHaE_?r=0&rs=1&pid=ImgDetMain&o=7&rm=3/300x200">

            <div class="card-content">

                <h3>Paris</h3>

                <p>
                    Enjoy beautiful city views.
                </p>

                <button>
                    Explore
                </button>

            </div>

        </div>

        <!-- CARD 2 -->

        <div class="card">

            <img
            src="https://th.bing.com/th/id/OIP.Urr8E55_4hu_AF2lO7TM-AHaEK?w=319&h=180&c=7&r=0&o=7&pid=1.7&rm=3/300x200">

            <div class="card-content">

                <h3>Maldives</h3>

                <p>
                    Relax near beaches.
                </p>

                <button>
                    Explore
                </button>

            </div>

        </div>

        <!-- CARD 3 -->

        <div class="card">

            <img
            src="https://th.bing.com/th/id/OIP.gby6wsXiXz9zEoMrEGhKOQHaE8?w=245&h=180&c=7&r=0&o=7&pid=1.7&rm=3/300x200">

            <div class="card-content">

                <h3>Dubai</h3>

                <p>
                    Experience luxury travel.
                </p>

                <button>
                    Explore
                </button>

            </div>

        </div>

        <!-- CARD 4 -->

        <div class="card">

            <img
            src="https://th.bing.com/th/id/OIP.HrRY9L4hox_fUr8mMhGb_AHaE2?w=260&h=180&c=7&r=0&o=7&pid=1.7&rm=3/300x200">

            <div class="card-content">

                <h3>Switzerland</h3>

                <p>
                    Enjoy snowy mountains.
                </p>

                <button>
                    Explore
                </button>

            </div>

        </div>

    </section>

    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 TravelX Website
        </p>

    </footer>

    
</body>
</html>
