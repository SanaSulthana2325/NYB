
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 16px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Result</h1>

        <input
            type="text"
            id="studentName"
            placeholder="Enter student name">

        <input
            type="number"
            id="maths"
            placeholder="Enter Maths marks">

        <input
            type="number"
            id="science"
            placeholder="Enter Science marks">

        <input
            type="number"
            id="english"
            placeholder="Enter English marks">

        <button onclick="generateResult()">
            Generate Result
        </button>

        <div id="result"></div>

    </div>

    <script src="./Mini.js"></script>

</body>
</html>
