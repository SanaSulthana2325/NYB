<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--form : use to create form that collects information from the user-->

    <h2>form</h2>
     <form>
    <!--Text Input: used to enter normal text such as name-->

    <h2> text Input</h2>
    <input type="text" placeholder="Enter your name">

    <!-- email: used to enter email address-->
     
    <h2>email</h2>
    <input type="email"  name="email" placeholder="Enter Email">
    <button type="submit">submit</button>
<br/><br>
    <!-- use to enter password. the character are hidden-->
    <h2> password</h2>
    <input type = "password" placeholder="enter your password">

    <!--number: used to enter numeric values-->

    <h2> Number</h2>
    <input type="number" placeholder="enter your age">

    <!--date: used to select a date-->

    <h2>date</h2>
    <input type="date" placeholder="DD/MM/YYYY">

    <!--File : used to upload file-->

    <h2>file</h2>

    <input type="file">

    <!--Radio: used when the user should select one option-->

    <h2>Radio button</h2>

    <input type="radio" name="gender" value="male">Male
    <input type="radio" name="gender" value="female">female

    <!-- checkbox: user can select multiple options-->

    <h2> checkbox</h2>
    <input type="checkbox">HTML
    <input type="checkbox">js
    <input type="checkbox">css
    <input type="checkbox">react

    <!--submit: used to submit the form-->

    <h2>Submit</h2>
    <button type="Submit"> submit</button>

    <h2> reset</h2>

    <button type="Reset">Reset</button>

    <!--TextArea: used for multiple line text -->

    <h2> Textarea</h2>

    <textarea rows="3" cols="8" placeholder="enter your message"></textarea>

    <!-- select: dropdown list-->

    <h2> dropdown list</h2>

    <select>
        <option>AAA</option>
        <option>BBB</option>
        <option>CCC</option>
        <option>DDD</option>
        <option>EEE</option>

    </select>

    <h2> Option</h2>

    <select>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="js">JS</option>

    </select>

    </form>

    
</body>
</html>





<!-- | Element    | Purpose                |
| ---------- | ---------------------- |
| `form`     | Creates the form       |
| `text`     | Normal text            |
| `email`    | Email address          |
| `password` | Hidden password        |
| `number`   | Numbers                |
| `date`     | Date selection         |
| `file`     | File upload            |
| `radio`    | Select **one**         |
| `checkbox` | Select **multiple**    |
| `submit`   | Submit form            |
| `reset`    | Clear form             |
| `button`   | Clickable button       |
| `textarea` | Multiple lines of text |
| `select`   | Dropdown               |
| `option`   | Dropdown choice        | -->
