
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Practice</title>

    <style>

        /* 1. CSS FLEXBOX */

        .container {
            display: flex;
            background-color: lightgray;
            padding: 10px;
            flex-wrap: wrap-reverse;
            gap: 20px;
        }

        .box {
            background-color: lightblue;
            padding: 30px;
            border: 1px solid blue;
        }


        /* 2. FLEX GROW */

        .grow-container {
            display: flex;
            gap: 10px;
        }

        .grow-box {
            padding: 20px;
            background-color: lightblue;
            border: 1px solid blue;
        }

        .box1 {
            flex-grow: 1;
        }

        .box2 {
            flex-grow: 2;
        }

        .box3 {
            flex-grow: 1;
        }


        /* 3. CSS GRID */

        .container1 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .grid-box {
            background-color: lightblue;
            padding: 40px;
            text-align: center;
        }


        /* 4. GRID AREAS */

        .container2 {
            display: grid;
            grid-template-columns: 1fr 3fr;

            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";

            gap: 10px;
        }

        header {
            grid-area: header;
        }

        aside {
            grid-area: sidebar;
        }

        main {
            grid-area: main;
        }

        footer {
            grid-area: footer;
        }

        header, aside, main, footer {
            background-color: lightblue;
            padding: 20px;
        }


        /* 5. RESPONSIVE DESIGN */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .container3 {
            display: flex;
            gap: 20px;
        }

        .card {
            background-color: lightblue;
            padding: 40px;
            flex: 1;
            text-align: center;
        }

        @media (max-width: 600px) {

            .container3 {
                flex-direction: column;
            }

        }


        /* 6. MEDIA QUERIES */

        .box11 {
            width: 500px;
            max-width: 100%;
            height: 200px;
            background-color: green;
            color: white;
            text-align: center;
            padding: 50px;
        }

        /* Tablet */

        @media (max-width: 768px) {

            .box11 {
                width: 100%;
                background-color: blue;
            }

        }

        /* Mobile */

        @media (max-width: 480px) {

            .box11 {
                width: 100%;
                background-color: red;
                font-size: 14px;
            }

        }


        /* 7. CSS TRANSITIONS */

        .btn {
            background-color: blue;
            color: white;
            padding: 15px 30px;
            border: none;
            cursor: pointer;

            transition: background-color 1s;
        }

        .btn:hover {
            background-color: red;
        }


        /* 8. CSS TRANSFORMS */

        .box22 {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            text-align: center;
            padding: 10px;

            transform: translate(50px, 30px);
        }


        /* 9. CSS ANIMATIONS */

        .box33 {
            width: 100px;
            height: 100px;
            background-color: blue;
            color: white;
            text-align: center;
            padding: 20px;

            animation-name: changeColor;
            animation-duration: 1s;
        }

        @keyframes changeColor {

            from {
                background-color: blue;
            }

            to {
                background-color: red;
            }

        }

    </style>
</head>

<body>

    <!-- 1. FLEXBOX -->

    <h2>CSS Flexbox</h2>

    <!-- Flexbox is a one-dimensional layout system.
         It arranges items in a row or column. -->

    <div class="container">

        <div class="box">Item 1</div>
        <div class="box">Item 2</div>
        <div class="box">Item 3</div>

    </div>

    <hr>


    <!-- 2. FLEX GROW -->

    <h2>Flex Grow</h2>

    <!-- Controls how much an item grows
         to occupy extra available space. -->

    <div class="grow-container">

        <div class="grow-box box1">Box 1</div>
        <div class="grow-box box2">Box 2</div>
        <div class="grow-box box3">Box 3</div>

    </div>

    <hr>


    <!-- 3. CSS GRID -->

    <h2>CSS Grid</h2>

    <!-- Grid is a two-dimensional layout system.
         It arranges items using rows and columns. -->

    <div class="container1">

        <div class="grid-box">Box 1</div>
        <div class="grid-box">Box 2</div>
        <div class="grid-box">Box 3</div>
        <div class="grid-box">Box 4</div>

    </div>

    <hr>


    <!-- 4. GRID AREAS -->

    <h2>Grid Areas</h2>

    <!-- Grid areas are used to create
         named layout sections. -->

    <div class="container2">

        <header>Header</header>

        <aside>Sidebar</aside>

        <main>Main Content</main>

        <footer>Footer</footer>

    </div>

    <hr>


    <!-- 5. RESPONSIVE DESIGN -->

    <h2>Responsive Design</h2>

    <!-- Responsive design adjusts website layouts
         according to different screen sizes. -->

    <div class="container3">

        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>

    </div>

    <hr>


    <!-- 6. MEDIA QUERIES -->

    <h2>Media Queries</h2>

    <!-- Media queries apply different CSS styles
         based on screen size. -->

    <div class="box11">

        Responsive Box

    </div>

    <hr>


    <!-- 7. CSS TRANSITIONS -->

    <h2>CSS Transitions</h2>

    <!-- Transitions make CSS changes happen smoothly. -->

    <button class="btn">

        Hover Me

    </button>

    <hr>


    <!-- 8. CSS TRANSFORMS -->

    <h2>CSS Transforms</h2>

    <!-- Transforms move, rotate, resize,
         and tilt elements. -->

    <div class="box22">

        Translate

    </div>

    <br><br><br><br>

    <hr>


    <!-- 9. CSS ANIMATIONS -->

    <h2>CSS Animations</h2>

    <!-- Animations change element styles automatically
         over a specified duration. -->

    <div class="box33">

        Animation

    </div>


</body>
</html>
