What is React?

React is a popular JavaScript library used to build fast, interactive, and reusable user interfaces, especially for web applications.

It was developed by Meta (Facebook).

React mainly focuses on the View Layer (UI) in applications.

Why React is Used
Reusable Components
Faster UI updates
Easy to maintain
Single Page Applications (SPA)
Large community support
Strong ecosystem-->

<!--
Key Features of React

1. Component-Based Architecture:
React applications are divided into small reusable pieces called components.


2. Virtual DOM:
React uses a Virtual DOM to improve performance.

a.Real DOM

Updating the actual browser DOM is slow.

b.Virtual DOM

React first updates a virtual copy, compares changes, and updates only the changed parts.

This process is called:

Diffing
Reconciliation

3. JSX (JavaScript XML) : JSX allows writing HTML inside JavaScript.


4. One-Way Data Binding

Data flows from:

Parent → Child

This makes debugging easier and improves control.

5. State and Props
Props: Used to pass data between components.

State: Used to store dynamic data inside components.-->


<!--
*React Architecture : React follows a Component-Based Architecture.

Architecture Flow
UI → Components → State → Virtual DOM → Real DOM

Types of Components
1. Functional Components

Modern React mostly uses functional components.

2. Class Components : Older approach.


3. Parent and Child Components
Parent Component
      ↓
Child Component


4. React Data Flow : Unidirectional Data Flow

Data moves only in one direction:

Parent → Child

Benefits:

Easier debugging
Better control
Predictable behavior

5. React Lifecycle (Simple)
Mounting

Component created.

Updating

Component changes.

Unmounting

Component removed.


6. Hooks in React

Hooks allow functional components to use React features.-->

WORK FLOW OF REACT:
