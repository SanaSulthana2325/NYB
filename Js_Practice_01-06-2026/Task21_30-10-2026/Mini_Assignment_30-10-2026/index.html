
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Employee Management System</h1>

    <form id="employeeForm">
        <input id="name" placeholder="Employee Name">
        <input id="email" type="email" placeholder="Email">
        <input id="department" placeholder="Department">
        <input id="salary" type="number" placeholder="Salary">

        <button type="submit">Add Employee</button>
    </form>

    <h2>Employee List</h2>

    <input id="search" placeholder="Search employee">

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="employeeList"></tbody>
    </table>

    <p id="message"></p>

    <button id="loadApi">Load Sample API Data</button>

    <script type="module" src="app.js"></script>
</body>
</html>
